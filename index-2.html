<script>

const $=s=>document.querySelector(s);const S={p:0,snd:false,nar:true,pick:{},rows:[{o:"",g:"",y:"",d:false}],dec:"",vo:{a:"",m:""}};

let AC,mg,amb;const ac=()=>{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination)}if(AC.state=="suspended")AC.resume();return AC};
function tone(f,t0,d,ty="sine",v=.15){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.1)}
function noise(d,f,q,v,sw){const a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type="bandpass";fl.frequency.setValueAtTime(f,a.currentTime);if(sw)fl.frequency.linearRampToValueAtTime(sw,a.currentTime+d);fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(v,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+d);s.connect(fl);fl.connect(g);g.connect(mg);s.start()}
const SND={chime:()=>[784,988,1319].forEach((f,i)=>tone(f,i*.12,1.4)),pour:()=>noise(1.8,500,1.5,.6,1400),rustle:()=>noise(.9,5000,.8,.4,3000),bird:()=>[0,.18,.36,.7,.88].forEach((t,i)=>tone(2400+i*220,t,.12,"sine",.07)),music:()=>[523,587,659,784,659,587,523].forEach((f,i)=>tone(f,i*.28,.6,"triangle",.12))};
function play(k){if(!S.snd){hint("Sound is off. Tap “Sound” at the top to enable it.");return}if(AUDIO_FILES[k]){new Audio(AUDIO_FILES[k]).play().catch(()=>SND[k]());return}SND[k]()}
function mood(){if(!amb)return;amb.g.gain.setTargetAtTime(S.snd?[.28,.28,.12,.28,.28,.28,.28,.28,.28,.4,.28][S.p]:0,AC.currentTime,.5)}
$("#bs").onclick=e=>{S.snd=!S.snd;e.target.setAttribute("aria-pressed",S.snd);e.target.textContent="Sound: "+(S.snd?"on":"off");if(S.snd){ac();if(!amb){const g=AC.createGain();g.gain.value=0;g.connect(mg);amb={g,i:0};const mel=[392,440,523,587,523,440,392,330,392,440,523,659,587,523,440,392],bass=[196,196,220,174.6];const mn=(f,d,ty,v)=>{const o=AC.createOscillator(),e=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+.08);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(amb.g);o.start(t);o.stop(t+d+.1)};setInterval(()=>{if(!S.snd)return;const i=amb.i++;mn(mel[i%16],1.8,"sine",.5);if(i%4==0){const b=bass[(i/4|0)%4];mn(b,3.4,"triangle",.4);mn(b*1.5,3.4,"sine",.2)}},900)}SND.chime()}mood()};
const VP={n:[.95,.86],amma:[.9,.82],mattea:[1.75,1.03]};const VOICE_FILES={/* optional recorded voices keyed "page-paragraph", e.g. "3-0":"audio/p3-0.mp3" */};
let VOICES=[];const MALE=/david|mark|daniel|alex|fred|george|guy|ryan|james|tom|aaron|gordon|rishi|arthur|oliver|male$/i;
function score(v,pref){let c=0;if(/natural|neural|online/i.test(v.name))c+=5;if(/enhanced|premium/i.test(v.name))c+=4;if(pref.test(v.name))c+=3;if(/female/i.test(v.name))c+=1;if(MALE.test(v.name)&&!/female/i.test(v.name))c-=6;if(!v.localService)c+=1;return c}
function pickV(role){const f=VOICES.find(v=>v.name==S.vo[role]);if(f)return f;const pref=role=="a"?/serena|moira|karen|libby|sonia|susan|uk english female|samantha/i:/ava|jenny|aria|tessa|fiona|allison|google us english|zira/i;return [...VOICES].sort((x,y)=>score(y,pref)-score(x,pref))[0]}
function fillV(){["a","m"].forEach(r=>{const s=$("#v"+r);if(!s)return;s.innerHTML=VOICES.map(v=>`<option>${v.name}</option>`).join("");const c=pickV(r);if(c)s.value=c.name})}
function loadV(){if(!window.speechSynthesis)return;VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));fillV()}
function say(segs){if(!S.nar)return hint("Narration is off. Turn it on at the top.");if(!window.speechSynthesis)return hint("This browser has no speech voices. The text is shown instead.");speechSynthesis.cancel();if(!VOICES.length)loadV();segs.forEach(([t,w])=>{const v=pickV(w=="mattea"?"m":"a"),[p,r]=VP[w]||VP.n;t.replace(/\s+/g," ").trim().split(/(?<=[.!?])\s+/).forEach(c=>{if(!c)return;const u=new SpeechSynthesisUtterance(c);if(v){u.voice=v;u.lang=v.lang}u.pitch=p*(/\?$/.test(c)?1.06:1);u.rate=r*(/!$/.test(c)?1.04:1);speechSynthesis.speak(u)})})}
const SAY=(t,w)=>say([[t,w]]);
function parts(t,q,v){t=t.replace(/^(ONE|TWO|THREE|FOUR) · /,(m,k)=>({ONE:"Step one. ",TWO:"Step two. ",THREE:"Step three. ",FOUR:"Step four. "}[k]));const out=[],re=/[“"]([^“”"]+)[”"]/g;let last=0,i=0,m;while(m=re.exec(t)){if(m.index>last)out.push([t.slice(last,m.index),v||"n"]);out.push([m[1],q[i++]||"amma"]);last=re.lastIndex}if(last<t.length)out.push([t.slice(last),v||"n"]);return out.filter(x=>x[0].trim())}
$("#bn").onclick=e=>{S.nar=!S.nar;e.target.setAttribute("aria-pressed",S.nar);e.target.textContent="Narration: "+(S.nar?"on":"off");if(!S.nar&&window.speechSynthesis)speechSynthesis.cancel()};

const THEMES=[["A black tie",["#2a2a3a","#d9a441","#f6efe2"],"Elegant and formal, though it may feel less personal."],["A magical theme",["#6b5a8a","#b9a9d6","#d9a441"],"Full of wonder, though it asks for more imagining and decorating."],["A celebration of the earth",["#b5623f","#8fa388","#d9a5a0"],"Personal and natural, though it may feel less extravagant to some guests."]];
const PATHS=[["The quickest path","It gets you there fastest.","The garden along it is bare."],["The path full of flowers","It is beautiful all the way.","It is slow."],["The picnic path","It is perfect for a picnic.","It won’t reach the castle by sunset."]];
const VEN=[["Change the theme to fit an available venue","Solves the venue quickly.","Gives up the theme that matters most to Mattea."],["Search for another venue that might work","Keeps the theme.","Only days remain, so it may not be possible."],["Host the ball in the royal gardens","Keeps the theme and feels personal.","Needs quick teamwork and creativity."]];
const GS="I don't need to know everything to choose. My responsibility is to consider my options, honour what matters to me and trust myself to handle what comes next.";
const LET="Dear Amma, I DID IT! At some point, the planner couldn’t find a venue aligned with the theme, but I trusted myself to find another way. And I did! We held the ball in our gardens, and everyone loved it. I didn’t need everything to go perfectly. When things changed, I changed with them. I now know that I don’t need to know everything before I make a decision. I just need to choose what's most aligned to me and trust myself with what comes next. I miss you and I love you. Your Earthy Grounded Princess, Mattea.";

{s:"s1",h:"1 · The Big Decision",tx:[TX("Princess Mattea was about to be crowned, and the All-Country Ball would gather guests from every kingdom. At her desk, among fabric swatches, flowers and gown sketches, she had only to choose a theme."),TX("A black tie? A magical theme? A celebration of the earth? Every idea shimmered. Every one was lovely.")],hs:[[700,440,90,110,"Flowers","Tap to listen",()=>play("bird")]]},

{s:"s4",h:"4 · The World Does Not Promise Certainty",tx:[TX("Amma poured tea into two painted cups. “Even the wisest queens can’t know everything before they choose. Sometimes we choose well and things still don’t go to plan. Uncertainty and not knowing fully are visitors in your decision making process. Uncertainty and not knowing fully are principles of this world just like gravity. So they will always be there with you as you make decisions just like gravity is always there with you as you walk, seat and play.”",["amma"]),TX("“So I shouldn’t keep thinking until I know?”",["mattea"]),TX("“Exactly! You can't think your way out of these two visitors. Choose a path knowing you can’t see the whole journey. That is where trade-offs begin.”",["amma"]),TX(`"What are trade offs Amma?"`,["mattea"])],hs:[[345,570,70,70,"Teacup","Tap to listen",()=>play("pour")],[445,570,70,70,"Teacup","Tap to listen",()=>play("pour")],[220,450,180,300,"Amma","Tap to listen",()=>SAY("Even the wisest queens can’t know everything before they choose. Sometimes we choose well and things still don’t go to plan.","amma")]]},
{s:"s5",h:"5 · The Art of Making Trade-Offs",tx:[TX("In the garden, three paths. “This one is quickest, but the garden is bare. That one is full of flowers, but slow. The third is perfect for a picnic, but won’t reach the castle by sunset.”",["amma"]),TX("“I like something about every path Amma!”",["mattea"]),TX("“Of course baby! Each gives something and asks something of us. That is a trade-off. Choose the one whose gifts are worth its costs.”",["amma"]),TX("Lets do it practically step by step so you understand",[],"amma")],hs:[[130,600,190,220,"The quickest path","Tap to explore",()=>selP(0)],[400,600,170,220,"The path full of flowers","Tap to explore",()=>selP(1)],[650,600,200,220,"The picnic path","Tap to explore",()=>selP(2)]]},
{s:"s6",h:"6 · Mattea’s Four Little Steps",tx:[TX("ONE · Invite Uncertainty to tea. She doesn’t need to vanish before you choose. You are safe with her.",[],"amma"),TX("TWO · Look at both sides. What does each option offer and what might you give up if you dont select it?",[],"amma"),TX("THREE · Hug yourself. “I don’t have to know everything before I move. I can trust myself to adapt to what comes up.”",["mattea"],"amma"),TX(`FOUR · Choose and move. "Okay Amma, using this, I choose the Celebration of Earth theme."`,["mattea"],"amma")],hs:[[205,190,200,200,"Uncertainty at the tea table","Tap to listen",unc]]},
{s:"s7",h:"7 · When Regret Comes for Tea",tx:[TX("A tiny, curious purple Regret fluttered in Matteas mind. “But Amma, what if the other theme turns out better?”",["mattea"]),TX("“Aha! The last visitor - her name is Regret. She visits after make decisions, baby. You can’t travel every path at once so she comes when we thing of what we had to give up when making the decision or when things do go as planned.\"",["amma"]),TX("\"Invite her for tea and tell her: Hello, Regret. I made the best choice I could. If something goes wrong, I’ll learn and respond.” Regret sipped her tea and drifted away.",["amma"])],hs:[[400,360,220,150,"Regret","Tap to animate",()=>{play("rustle");flutter()}]]},
{s:"s8",h:"8 · The Moment Mattea Chooses Herself",tx:[TX("“What if I still get scared Amma?” “You will, sometimes. Courage means fear doesn’t make every decision for you.”",["mattea","amma"]),TX("Amma kissed her forehead. “You don’t have to be perfect. Just keep practising.” She vanished in golden leaves.",["amma"])],hs:[[220,430,200,330,"Amma","Tap to listen",()=>SAY("You don’t have to be perfect. Just keep practising.","amma")]]},

function selP(i){document.querySelectorAll(".pc").forEach((c,j)=>c.classList.toggle("on",i==j));const b=$("#pd");if(b){const t=PATHS[i];b.innerHTML=`<b>${t[0]}</b><br>Gift: ${t[1]}<br>Cost: ${t[2]}<p class="q">What matters most to you here? What might you have to give up?</p><button class="btn pri" id="pk">This feels right for me</button><p id="pn" class="box" hidden></p>`;$("#pk").onclick=()=>{S.pick.path=t[0];save();const n=$("#pn");n.hidden=false;n.textContent="You chose "+t[0].toLowerCase()+". Each path gives something and asks something. There is no single right answer."}}}
function tbl(el){el.innerHTML=`<div class="tw"><table><thead><tr><th>Options</th><th>Give up</th><th>Offer</th><th>Decision</th></tr></thead><tbody></tbody></table></div><p><button class="btn" data-a="add">Add an option</button> <button class="btn" data-a="cp">Copy my table</button></p>`;const tb=el.querySelector("tbody");const draw=()=>{tb.innerHTML=S.rows.map((r,i)=>`<tr>${["o","g","y"].map(k=>`<td><textarea rows="2" data-i="${i}" data-k="${k}" aria-label="${k=="o"?"Option":k=="g"?"Give up":"Offer"}"></textarea></td>`).join("")}<td style="text-align:center"><input type="checkbox" style="width:24px;height:24px" data-i="${i}" aria-label="Final decision"></td></tr>`).join("");tb.querySelectorAll("textarea").forEach(t=>{t.value=S.rows[t.dataset.i][t.dataset.k]||"";t.oninput=()=>{S.rows[t.dataset.i][t.dataset.k]=t.value;save()}});tb.querySelectorAll("input").forEach(c=>{c.checked=!!S.rows[c.dataset.i].d;c.onchange=()=>{S.rows.forEach((r,j)=>r.d=c.checked&&j==c.dataset.i);save();draw()}})};draw();el.querySelector('[data-a=add]').onclick=()=>{S.rows.push({o:"",g:"",y:"",d:false});save();draw()};el.querySelector('[data-a=cp]').onclick=async()=>{const x=S.rows.map(r=>`${r.d?"[x]":"[ ]"} Option: ${r.o}\n   Offers: ${r.y}\n   Give up: ${r.g}`).join("\n\n");try{await navigator.clipboard.writeText(x);hint("Copied.")}catch(e){hint("Copying isn’t available here. Select the text in the boxes instead.")}}}

6(el){el.innerHTML=`<h3>Try the four steps</h3><div class="box"><b>One.</b> <button class="btn" id="iu">Invite Uncertainty to tea</button></div><div class="box"><b>Two.</b> Write your options.<div id="t2"></div></div><div class="box"><b>Three.</b> <button class="btn" id="hg">Give yourself a hug</button><div id="hr"></div></div><div class="box"><b>Four.</b> Choose and move:<div id="ch"></div></div>`;$("#iu").onclick=unc;tbl($("#t2"));$("#hg").onclick=()=>{$("#hr").innerHTML='<div class="ring"></div>';SAY("I don’t have to know everything before I move. I can trust myself to adapt to what comes up.","mattea")};THEMES.forEach((t,i)=>{const b=document.createElement("button");b.className="card";b.innerHTML=`<b>${t[0]}</b>`;b.onclick=()=>{S.pick.theme=t[0];save();play("chime");document.querySelectorAll("#ch .card").forEach(c=>c.classList.remove("on"));b.classList.add("on")};$("#ch").appendChild(b)})},

9(el){el.innerHTML=`<h3>If your plan changed, what would you do?</h3><div id="vo"></div><div id="vd" class="box" hidden></div><p class="box" id="vr" hidden>Mattea trusted herself to find another way, and held the ball in her own gardens. An unexpected problem didn’t mean her first decision was wrong.</p><div class="box"><b>My decision</b><p>Think of one decision in your own life. What matters most to you here, and what might you have to give up?</p><textarea id="dc" rows="3" placeholder="Optional: write it here (stays on this device)"></textarea><p id="sm"></p></div><button class="btn pri" id="ra">Read again</button>`;VEN.forEach(v=>{const b=document.createElement("button");b.className="card";b.innerHTML=`<b>${v[0]}</b>`;b.onclick=()=>{S.pick.venue=v[0];save();el.querySelectorAll("#vo .card").forEach(c=>c.classList.remove("on"));b.classList.add("on");$("#vd").hidden=false;$("#vd").innerHTML=`<b>Advantage:</b> ${v[1]}<br><b>Cost:</b> ${v[2]}`;$("#vr").hidden=false;sm()};$("#vo").appendChild(b)});const sm=()=>$("#sm").textContent=`Practice picks: theme: ${S.pick.theme||"not chosen"}; path: ${S.pick.path||"not chosen"}; if the plan changed: ${S.pick.venue||"not chosen"}.`;sm();const d=$("#dc");d.value=S.dec;d.oninput=()=>{S.dec=d.value;save()};$("#ra").onclick=()=>go(-99)}};
